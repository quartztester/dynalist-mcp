[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dynalist-mcp"
version = "0.1.0"
description = "MCP server for the Dynalist outliner API (dynalist.io)"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27",
]

[project.scripts]
dynalist-mcp = "dynalist_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["dynalist_mcp"]
